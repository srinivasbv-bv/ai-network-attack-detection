# Logstash Pipeline Configuration for AI Network Attack Detection System

input {
  http {
    port => 5044
    codec => json
  }
  file {
    path => "${PROJECT_ROOT}/logs/network_security_events.json"
    start_position => "beginning"
    codec => json
  }
}

filter {
  date {
    match => [ "@timestamp", "ISO8601" ]
    target => "@timestamp"
  }

  mutate {
    add_tag => [ "ai_ids_detection", "mitre_mapped" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "network-security-events-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
